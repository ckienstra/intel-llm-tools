# ruff.toml
# This file is a Gemini-interpreted comversion of:
# https://github.com/google/styleguide/blob/gh-pages/pylintrc

# 1. Formatting (Replaces Pyink/Black)
line-length = 80
indent-width = 4
target-version = "py311" # Adjust to your python version

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# 2. Linting (Speedy checks)
[lint]
# Enable specific rule sets to match Google's strictness:
# E, W: Standard pycodestyle errors
# F: Pyflakes (unused imports, variables)
# I: isort (Import sorting - Google style)
# B: Flake8-bugbear (Likely bugs)
# D: Pydocstyle (Docstring formatting)
# UP: Pyupgrade (Modernize syntax)
select = ["E", "F", "W", "I", "B", "D", "UP"]

# Ignore specific conflicts if necessary
ignore = []

# 3. Google-Specific Settings
[lint.pydocstyle]
convention = "google"

[lint.isort]
force-single-line = true   # Google prefers one import per line
force-sort-within-sections = true
